<div class="modal modal-open modal-bottom sm:modal-middle">
    <div class="modal-box">
        <button (click)="close()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        <h3 class="font-bold text-lg">Change Your Password</h3>

        <form (ngSubmit)="onSubmit()" #changePasswordForm="ngForm" class="space-y-4 py-4">
            <div>
                <label for="oldPassword" class="label">
                    <span class="label-text">Current Password</span>
                </label>
                <input type="password" id="oldPassword" name="oldPassword" class="input input-bordered w-full"
                    [(ngModel)]="payload.oldPassword" #oldPasswordInput="ngModel" required minlength="8">
                <div *ngIf="oldPasswordInput.invalid && (oldPasswordInput.dirty || oldPasswordInput.touched)"
                    class="text-error text-xs mt-1">
                    <span *ngIf="oldPasswordInput.errors?.['required']">Current password is required.</span>
                    <span *ngIf="oldPasswordInput.errors?.['minlength']">Password must be at least 8 characters.</span>
                </div>
            </div>

            <div>
                <label for="newPassword" class="label">
                    <span class="label-text">New Password</span>
                </label>
                <input type="password" id="newPassword" name="newPassword" class="input input-bordered w-full"
                    [(ngModel)]="payload.newPassword" #newPasswordInput="ngModel" required minlength="8">
                <div *ngIf="newPasswordInput.invalid && (newPasswordInput.dirty || newPasswordInput.touched)"
                    class="text-error text-xs mt-1">
                    <span *ngIf="newPasswordInput.errors?.['required']">New password is required.</span>
                    <span *ngIf="newPasswordInput.errors?.['minlength']">New password must be at least 8
                        characters.</span>
                </div>
            </div>

            <div>
                <label for="confirmNewPassword" class="label">
                    <span class="label-text">Confirm New Password</span>
                </label>
                <input type="password" id="confirmNewPassword" name="confirmNewPassword"
                    class="input input-bordered w-full" [(ngModel)]="confirmNewPassword"
                    #confirmNewPasswordInput="ngModel" required>
                <div *ngIf="confirmNewPasswordInput.invalid && (confirmNewPasswordInput.dirty || confirmNewPasswordInput.touched) && confirmNewPasswordInput.errors?.['required']"
                    class="text-error text-xs mt-1">
                    <span>Please confirm your new password.</span>
                </div>
            </div>

            <app-message [message]="errorMessage" type="error"></app-message>

            <div class="modal-action">
                <button type="button" (click)="close()" class="btn btn-ghost">Cancel</button>
                <button type="submit" class="btn btn-primary" [disabled]="changePasswordForm.invalid || isLoading">
                    <app-loading-indicator *ngIf="isLoading" [message]="'Changing...'" [size]="'xs'"></app-loading-indicator>
                    <span *ngIf="!isLoading">Change Password</span>
                </button>
            </div>
        </form>
    </div>
</div>
