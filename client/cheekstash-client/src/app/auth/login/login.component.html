<div class="min-h-screen flex items-center justify-center bg-base-200 py-12 px-4 sm:px-6 lg:px-8">
  <div class="card w-full max-w-md shadow-xl bg-base-100">
    <div class="card-body">
      <h2 class="card-title text-2xl justify-center mb-6">Login to Your Account</h2>

      <app-message [message]="registrationMessage" type="success"></app-message>
      <app-message [message]="errorMessage" type="error"></app-message>
      <app-message [message]="logoutMessage" type="info"></app-message>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-4">
        <div class="form-control">
          <label for="email" class="label">
            <span class="label-text">Email Address</span>
          </label>
          <input type="email" id="email" name="email"
                 [(ngModel)]="credentials.email"
                 class="input input-bordered w-full"
                 required
                 email
                 #emailInput="ngModel"
                 [ngClass]="{'input-error': emailInput.invalid && (emailInput.dirty || emailInput.touched)}">
          <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="text-error text-xs mt-1">
            <span *ngIf="emailInput.errors?.['required']">Email is required.</span>
            <span *ngIf="emailInput.errors?.['email']">Please enter a valid email address.</span>
          </div>
        </div>

        <div class="form-control">
          <label for="password" class="label">
            <span class="label-text">Password</span>
          </label>
          <input type="password" id="password" name="password"
                 [(ngModel)]="credentials.password"
                 class="input input-bordered w-full"
                 required
                 #passwordInput="ngModel"
                 [ngClass]="{'input-error': passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)}">
          <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="text-error text-xs mt-1">
            <span *ngIf="passwordInput.errors?.['required']">Password is required.</span>
          </div>
        </div>

        <div class="form-control mt-6">
          <button type="submit" class="btn btn-primary w-full" [disabled]="loginForm.invalid || isLoading">
            <app-loading-indicator *ngIf="isLoading" [message]="'Logging in...'" [size]="'xs'"></app-loading-indicator>
            <span *ngIf="!isLoading">Login</span>
          </button>
        </div>
      </form>

      <div class="text-sm text-center mt-4">
        <p>
          Don't have an account?
          <a routerLink="/register" class="link link-primary">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
