<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-4 text-primary">Admin Dashboard</h1>
    <p class="mb-8 text-lg text-base-content/80">Welcome to the admin area. Use the navigation below to manage different
        parts of the application.</p>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <a routerLink="manage-categories"
            class="card bg-base-100 shadow-xl hover:shadow-2xl transition-shadow duration-300 ease-in-out transform hover:-translate-y-1">
            <div class="card-body items-center text-center">
                <h2 class="card-title text-secondary">Manage Categories</h2>
                <p>Create, view, edit, and delete product categories.</p>
            </div>
        </a>

        <a routerLink="manage-tags"
            class="card bg-base-100 shadow-xl hover:shadow-2xl transition-shadow duration-300 ease-in-out transform hover:-translate-y-1">
            <div class="card-body items-center text-center">
                <h2 class="card-title text-secondary">Manage Tags</h2>
                <p>View and delete existing tags used for cheeks.</p>
            </div>
        </a>

        <a routerLink="manage-users"
            class="card bg-base-100 shadow-xl hover:shadow-2xl transition-shadow duration-300 ease-in-out transform hover:-translate-y-1">
            <div class="card-body items-center text-center">
                <h2 class="card-title text-secondary">Manage Users</h2>
                <p>View, delete, and manage user roles.</p>
            </div>
        </a>

        <!-- Add other admin links here as needed, following the card pattern -->
    </div>

    <!-- Router outlet for child admin routes -->
    <div class="mt-12">
        <router-outlet></router-outlet>
    </div>
</div>
